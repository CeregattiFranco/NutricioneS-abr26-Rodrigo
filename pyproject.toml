[project]
name = "nutriciones-sabla"
version = "2.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "W", "I"]
ignore = ["E501"] # Ignore line too long (handled by formatter)

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=nutriciones --cov-report=term-missing"
