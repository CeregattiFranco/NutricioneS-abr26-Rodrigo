version: '3.8'

services:
  app:
    image: ${DOCKER_IMAGE_NAME:-ghcr.io/nutriciones/nss-app:latest}
    container_name: nss-app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - BASE_URL=http://localhost:8000
    depends_on:
      - redis
    volumes:
      - .env:/app/.env
      - credentials.json:/app/credentials.json
      - ./data:/app/data
      - ./logs:/app/logs

  watchtower:
    image: containrrr/watchtower
    container_name: nss-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 1800 --cleanup

  redis:
    image: redis:alpine
    container_name: nss-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
    driver: local
